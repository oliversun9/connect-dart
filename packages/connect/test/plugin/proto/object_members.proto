syntax = "proto3";

package collision;

import "google/protobuf/empty.proto";

// Rpcs named after Object instance members conflict with those members
// in the generated spec class (conflicting_static_and_instance) and are
// rejected outright by the generated client extension type
// (extension_type_declares_member_of_object).
service ObjectMembers {
  rpc ToString(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc HashCode(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc RuntimeType(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc NoSuchMethod(google.protobuf.Empty) returns (google.protobuf.Empty);
}
